<svg viewBox="0 0 1000 260" xmlns="http://www.w3.org/2000/svg" font-family="Arial, Helvetica, sans-serif">
  <defs>
    <marker id="arrow1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#0c2b23"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="1000" height="260" fill="#fffdf7"/>
  <text x="500" y="30" text-anchor="middle" font-size="20" font-weight="bold" fill="#0c2b23">CookSmart — User Flow: Browsing &amp; Planning</text>

  <!-- Boxes -->
  <g font-size="14" fill="#1c1a17">
    <!-- User -->
    <rect x="20" y="90" width="120" height="60" rx="10" fill="#fbf6ea" stroke="#d4a13c" stroke-width="2"/>
    <text x="80" y="125" text-anchor="middle" font-weight="bold">User</text>

    <!-- Home -->
    <rect x="190" y="90" width="130" height="60" rx="10" fill="#0c2b23"/>
    <text x="255" y="125" text-anchor="middle" fill="#fffdf7" font-weight="bold">Home</text>

    <!-- Browse/Search -->
    <rect x="370" y="90" width="170" height="60" rx="10" fill="#0c2b23"/>
    <text x="455" y="118" text-anchor="middle" fill="#fffdf7" font-weight="bold">Browse / Search</text>
    <text x="455" y="136" text-anchor="middle" fill="#e6bf63" font-size="12">Category · Ingredient · Filter · Sort</text>

    <!-- Recipe Details -->
    <rect x="590" y="90" width="150" height="60" rx="10" fill="#0c2b23"/>
    <text x="665" y="125" text-anchor="middle" fill="#fffdf7" font-weight="bold">Recipe Details</text>

    <!-- Favourite -->
    <rect x="790" y="30" width="180" height="55" rx="10" fill="#c1602f"/>
    <text x="880" y="63" text-anchor="middle" fill="#fffdf7" font-weight="bold">♥ Favourite Recipes</text>

    <!-- Meal Planner -->
    <rect x="790" y="160" width="180" height="55" rx="10" fill="#184f40"/>
    <text x="880" y="193" text-anchor="middle" fill="#fffdf7" font-weight="bold">📅 Meal Planner</text>
  </g>

  <!-- Arrows -->
  <g stroke="#0c2b23" stroke-width="2" marker-end="url(#arrow1)" fill="none">
    <path d="M140,120 L188,120"/>
    <path d="M320,120 L368,120"/>
    <path d="M540,120 L588,120"/>
    <path d="M740,110 L788,80"/>
    <path d="M740,130 L788,175"/>
  </g>

  <text x="500" y="245" text-anchor="middle" font-size="12" fill="#6b6459">
    All data (localStorage) persists across page refreshes for Favourites, Meal Planner and Preferences.
  </text>
</svg>
