<svg viewBox="0 0 1150 260" xmlns="http://www.w3.org/2000/svg" font-family="Arial, Helvetica, sans-serif">
  <defs>
    <marker id="arrow2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#0c2b23"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="1150" height="260" fill="#fffdf7"/>
  <text x="575" y="30" text-anchor="middle" font-size="20" font-weight="bold" fill="#0c2b23">CookSmart — User Flow: AI Recipe Suggestion</text>

  <g font-size="13.5" fill="#1c1a17">
    <!-- Home -->
    <rect x="20" y="90" width="120" height="60" rx="10" fill="#0c2b23"/>
    <text x="80" y="125" text-anchor="middle" fill="#fffdf7" font-weight="bold">Home</text>

    <!-- AI Recipe Suggestion page -->
    <rect x="180" y="90" width="150" height="60" rx="10" fill="#0c2b23"/>
    <text x="255" y="125" text-anchor="middle" fill="#fffdf7" font-weight="bold">AI Suggestion</text>

    <!-- INPUT: Enter Ingredients -->
    <rect x="370" y="80" width="170" height="80" rx="10" fill="#d4a13c"/>
    <text x="455" y="105" text-anchor="middle" font-weight="bold">INPUT</text>
    <text x="455" y="125" text-anchor="middle" font-size="12">User types comma-</text>
    <text x="455" y="140" text-anchor="middle" font-size="12">separated ingredients</text>

    <!-- PROCESS -->
    <rect x="580" y="80" width="190" height="80" rx="10" fill="#184f40"/>
    <text x="675" y="102" text-anchor="middle" fill="#fffdf7" font-weight="bold">PROCESS</text>
    <text x="675" y="121" text-anchor="middle" fill="#e6bf63" font-size="11.5">Rule-based ingredient</text>
    <text x="675" y="136" text-anchor="middle" fill="#e6bf63" font-size="11.5">token-matching (TypeScript)</text>
    <text x="675" y="151" text-anchor="middle" fill="#e6bf63" font-size="11.5">match% = matched / total</text>

    <!-- OUTPUT -->
    <rect x="810" y="80" width="170" height="80" rx="10" fill="#d4a13c"/>
    <text x="895" y="102" text-anchor="middle" font-weight="bold">OUTPUT</text>
    <text x="895" y="121" text-anchor="middle" font-size="11.5">Ranked recipe list</text>
    <text x="895" y="136" text-anchor="middle" font-size="11.5">with matched / missing</text>
    <text x="895" y="151" text-anchor="middle" font-size="11.5">ingredients shown</text>

    <!-- Recipe Details -->
    <rect x="1020" y="90" width="115" height="60" rx="10" fill="#0c2b23"/>
    <text x="1077" y="118" text-anchor="middle" fill="#fffdf7" font-weight="bold" font-size="12.5">Recipe</text>
    <text x="1077" y="134" text-anchor="middle" fill="#fffdf7" font-weight="bold" font-size="12.5">Details</text>
  </g>

  <g stroke="#0c2b23" stroke-width="2" marker-end="url(#arrow2)" fill="none">
    <path d="M140,120 L178,120"/>
    <path d="M330,120 L368,120"/>
    <path d="M540,120 L578,120"/>
    <path d="M770,120 L808,120"/>
    <path d="M980,120 L1018,120"/>
  </g>

  <text x="575" y="220" text-anchor="middle" font-size="12" fill="#6b6459">
    No external AI API is called — the "AI" is a transparent, deterministic matching algorithm run entirely in the browser.
  </text>
</svg>
